name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Ensure a release exists for the tag. If one was already created by hand
  # (with hand-written notes), keep it; otherwise create one with
  # auto-generated notes.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: >
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Build and attach a binary per target. No Windows: commands are shell
  # scripts executed via /bin/bash, so las is unix-only by design.
  upload-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: las
          target: ${{ matrix.target }}
          tar: all
          checksum: sha256
          token: ${{ github.token }}
